name: Build RPA4All Desktop .deb

on:
  push:
    branches:
      - rpa4all-main
  workflow_dispatch:
    inputs:
      version_suffix:
        description: 'Version suffix'
        required: false
        default: 'rpa4all1'

jobs:
  build-deb:
    name: Build .deb package
    runs-on: ubuntu-22.04
    container:
      image: debian:trixie
      options: --user root

    steps:
      - name: Install build dependencies
        run: >-
          apt-get update -qq &&
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends
          git cmake ninja-build gcc g++ pkg-config
          qt6-base-dev qt6-tools-dev qt6-tools-dev-tools
          qt6-websockets-dev qt6-svg-dev qt6-declarative-dev
          qt6-5compat-dev
          qtkeychain-qt6-dev
          extra-cmake-modules
          libkf6archive-dev libkf6guiaddons-dev
          libkdsingleapplication-qt6-dev
          libinotifytools-dev
          shared-mime-info
          libsecret-1-dev libssl-dev libsqlite3-dev zlib1g-dev
          dpkg-dev fakeroot file curl python3

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: rpa4all-main
          fetch-depth: 0

      - name: Read version
        id: ver
        run: |
          MAJ=$(sed -n 's/^set(MIRALL_VERSION_MAJOR \([0-9]*\))/\1/p' VERSION.cmake)
          MIN=$(sed -n 's/^set(MIRALL_VERSION_MINOR \([0-9]*\))/\1/p' VERSION.cmake)
          PAT=$(sed -n 's/^set(MIRALL_VERSION_PATCH \([0-9]*\))/\1/p' VERSION.cmake)
          SUF="${{ github.event.inputs.version_suffix || 'rpa4all1' }}"
          VER="${MAJ}.${MIN}.${PAT}"
          PKGVER="${VER}-${SUF}"
          DEB_NAME="rpa4all-nextcloud-desktop_${PKGVER}_amd64.deb"
          echo "version=${VER}" >> "${GITHUB_OUTPUT}"
          echo "pkg_version=${PKGVER}" >> "${GITHUB_OUTPUT}"
          echo "deb_name=${DEB_NAME}" >> "${GITHUB_OUTPUT}"
          echo "tag=v${PKGVER}-rpa4all-linux" >> "${GITHUB_OUTPUT}"

      - name: CMake configure
        run: |
          mkdir build && cd build
          cmake .. -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DQT_MAJOR_VERSION=6 \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DBUILD_UPDATER=OFF \
            -DBUILD_TESTING=OFF \
            -DLINUX_PACKAGE_SHORTNAME=rpa4all-nextcloud-desktop \
            -DMIRALL_VERSION_SUFFIX="" \
            -DMIRALL_VERSION_BUILD="${{ github.run_number }}"

      - name: Build
        run: cd build && ninja -j$(nproc)

      - name: Install to staging
        run: cd build && DESTDIR="${GITHUB_WORKSPACE}/pkg_root" ninja install

      - name: Create DEBIAN/control
        run: |
          mkdir -p pkg_root/DEBIAN
          python3 -c "
          import sys
          ver = sys.argv[1]
          ctrl = f'''Package: rpa4all-nextcloud-desktop
          Version: {ver}
          Architecture: amd64
          Maintainer: RPA4All <edenilson.adm@gmail.com>
          Depends: libqt6core6t64 | libqt6core6, libsecret-1-0
          Section: net
          Priority: optional
          Description: RPA4All Files Desktop Sync Client
           Syncs files with RPA4All Nextcloud.
          '''
          open('pkg_root/DEBIAN/control','w').write(ctrl)
          " "${{ steps.ver.outputs.pkg_version }}"

      - name: Build .deb
        run: fakeroot dpkg-deb --build pkg_root "${{ steps.ver.outputs.deb_name }}"

      - name: SHA256
        id: sha
        run: |
          SHA=$(sha256sum "${{ steps.ver.outputs.deb_name }}" | awk '{print $1}')
          echo "sha256=${SHA}" >> "${GITHUB_OUTPUT}"

      - name: Upload artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: rpa4all-nextcloud-desktop-deb
          path: ${{ steps.ver.outputs.deb_name }}
          compression-level: 0

      - name: Create Release via API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          DEB="${{ steps.ver.outputs.deb_name }}"
          REPO="${{ github.repository }}"
          SHA="${{ steps.sha.outputs.sha256 }}"
          VER="${{ steps.ver.outputs.version }}"
          PKGVER="${{ steps.ver.outputs.pkg_version }}"
          RUN="${{ github.run_number }}"
          RELEASE_ID=$(curl -sf -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${REPO}/releases/tags/${TAG}" | \
            python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('id',''))" 2>/dev/null || true)
          if [ -n "${RELEASE_ID}" ]; then
            curl -sf -X DELETE -H "Authorization: Bearer ${GH_TOKEN}" \
              "https://api.github.com/repos/${REPO}/releases/${RELEASE_ID}" || true
            curl -sf -X DELETE -H "Authorization: Bearer ${GH_TOKEN}" \
              "https://api.github.com/repos/${REPO}/git/refs/tags/${TAG}" || true
          fi
          python3 - "${TAG}" "${PKGVER}" "${VER}" "${DEB}" "${SHA}" "${RUN}" "${REPO}" "${GH_TOKEN}" << 'PYEOF'
          import json, sys, urllib.request
          tag, pkgver, ver, deb, sha, run, repo, token = sys.argv[1:]
          headers = {"Authorization": f"Bearer {token}", "Content-Type": "application/json"}
          body = json.dumps({
            "tag_name": tag,
            "name": f"RPA4All Files Desktop {pkgver} (Linux)",
            "body": f"Release Linux (.deb)\n\n- Base: Nextcloud Desktop {ver}\n- Pacote: {deb}\n- SHA256: {sha}\n- Branch: rpa4all-main\n- Build: #{run}",
            "draft": False, "prerelease": False, "make_latest": "true"
          }).encode()
          req = urllib.request.Request(f"https://api.github.com/repos/{repo}/releases", data=body, headers=headers, method="POST")
          resp = json.loads(urllib.request.urlopen(req).read())
          upload_url = resp["upload_url"].split("{")[0]
          with open(deb, "rb") as f:
            data = f.read()
          req2 = urllib.request.Request(f"{upload_url}?name={deb}", data=data, headers={
            "Authorization": f"Bearer {token}",
            "Content-Type": "application/vnd.debian.binary-package"
          }, method="POST")
          urllib.request.urlopen(req2)
          print(f"Release: https://github.com/{repo}/releases/tag/{tag}")
          PYEOF
